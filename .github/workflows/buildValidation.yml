name: BE-Automation_Build_Validation_Main
 
on:

  push:

    branches:
    - main

  pull_request:

    branches:
    - main
 
jobs:

  build:

    name: Build and Test

    runs-on: windows-latest
 
    steps:

      - name: Checkout code

        uses: actions/checkout@v3
 
      - name: Setup .NET

        uses: actions/setup-dotnet@v3

        with:

          dotnet-version: '8.0'
 
      - name: Restore dependencies

        run: |
          cd .\BackEndAutomation\
          dotnet restore
 
      - name: Build project

        run: |
          cd .\BackEndAutomation\
          dotnet build --no-restore --configuration Release

 