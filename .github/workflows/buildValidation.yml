name: BE-Automation_Build_Validation
 
on:

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]
 
jobs:

  build:

    name: Build and Test

    runs-on: windows-latest
 
    steps:

      - name: Checkout code

        uses: actions/checkout@v4
 
      - name: Setup .NET

        uses: actions/setup-dotnet@v4

        with:

          dotnet-version: '8.0.x'
 
      - name: Restore dependencies

        run: dotnet restore \BackEndAutomation\BackEndAutomation.sln
 
      - name: Build project

        run: dotnet build \BackEndAutomation\BackEndAutomation.sln --no-restore --configuration Release

 